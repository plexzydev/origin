# ═══════════════════════════════════════════════════════════
# PrisonGens - Configuración de GENS
# Un GEN es una mina completa: ítem físico con nivel, XP,
# capacidad de alimentación y progreso propio.
# ═══════════════════════════════════════════════════════════

# XP necesaria por nivel: xp_para_subir = base-xp-per-level * nivel_actual
base-xp-per-level: 100

# XP que otorga un GEN al ser usado como alimento, según la
# relación de tier entre el GEN comida y el GEN principal.
feed-xp:
  # comida de tier IGUAL al principal
  equal-multiplier: 1.0
  # comida de tier INFERIOR (por cada tier de diferencia se reduce)
  lower-multiplier: 0.35
  # comida de tier SUPERIOR (por cada tier de diferencia aumenta)
  higher-multiplier: 2.5

categories:
  INICIAL:
    tier: 1
    display: "GEN Inicial"
    color: "§7"
    icon: COBBLESTONE
    base-feed-capacity: 10
    max-stage: 3
    feed-base-xp: 100
    price: 1000
  HIERRO:
