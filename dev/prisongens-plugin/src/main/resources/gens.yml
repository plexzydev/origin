# ═══════════════════════════════════════════════════════
# PrisonGens - Configuración de GENS
# Cada GEN es una mina completa. Categorías extensibles.
# ═══════════════════════════════════════════════════════

xp:
  # XP necesaria para subir de nivel: base * (nivel ^ exponente)
  base-per-level: 100
  exponent: 1.5
  max-level: 100
  feed:
    # XP otorgada al alimentar según tier relativo del GEN consumido
    lower-tier: 25        # GEN de tier inferior (dividido por la diferencia de tiers)
    same-tier: 100        # GEN del mismo tier
    higher-tier: 300      # GEN de tier superior (multiplicado por la diferencia)
    per-level-bonus: 15   # XP extra por cada nivel del GEN consumido

mix:
  # % de la composición de la mina que aporta el GEN primario (slot 1)
  primary-weight: 60

