# ═══════════════════════════════════════════════════════════
# PrisonGens - Configuración de MINAS dinámicas
# ═══════════════════════════════════════════════════════════

# Bloques colocados por tick durante resets/crecimientos (anti-lag)
blocks-per-tick: 2500

# Intervalo de reset automático por defecto (ticks). Reducible con mejoras.
default-reset-ticks: 1200
min-reset-ticks: 200

# Etapas de crecimiento: half = mitad del ancho (5x5 => half 2), depth = profundidad.
# points = puntos de tamaño necesarios (suma de niveles de todos los GENS activos).
stages:
  - { half: 2,  depth: 10, points: 0 }
  - { half: 3,  depth: 11, points: 3 }
  - { half: 4,  depth: 12, points: 7 }
  - { half: 5,  depth: 12, points: 12 }
  - { half: 7,  depth: 13, points: 20 }
  - { half: 9,  depth: 14, points: 32 }
  - { half: 12, depth: 15, points: 50 }
  - { half: 15, depth: 16, points: 75 }

# Cada N de capacidad de alimentación total desbloquea 1 etapa extra
capacity-per-stage: 8

# Composición de bloques por categoría de GEN (porcentajes)
composition:
  INICIAL:
    COBBLESTONE: 70
    STONE: 25
    COAL_ORE: 5
  HIERRO:
    STONE: 50
    IRON_ORE: 35
    COAL_ORE: 15
  ORO:
    STONE: 40
    IRON_ORE: 25
    GOLD_ORE: 35
  DIAMANTE:
    STONE: 30
    GOLD_ORE: 30
    DIAMOND_ORE: 40
  ESMERALDA:
    STONE: 20
    DIAMOND_ORE: 40
    EMERALD_ORE: 40
  NETHERITE:
    DIAMOND_ORE: 30
    EMERALD_ORE: 35
    ANCIENT_DEBRIS: 35

# Precios de venta directa por bloque minado
prices:
  COBBLESTONE: 1.0
  STONE: 1.5
  COAL_ORE: 3.0
  IRON_ORE: 6.0
  GOLD_ORE: 15.0
  DIAMOND_ORE: 50.0
  EMERALD_ORE: 150.0
  ANCIENT_DEBRIS: 500.0
